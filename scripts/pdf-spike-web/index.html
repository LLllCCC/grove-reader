<!doctype html>
<html><head><meta charset="utf-8"><style>body{background:#555}canvas{border:1px solid #888}</style></head>
<body>
<pre id="log"></pre>
<canvas id="c"></canvas>
<script type="module">
const log = (...m) => { document.getElementById('log').textContent += m.join(' ') + '\n' }
console.error = (...a) => { log('[console.error]', ...a) }
try {
	// 与插件一致：主线程 fake worker（globalThis.pdfjsWorker）
	const workerMod = await import('./pdf.worker.min.mjs')
	globalThis.pdfjsWorker = workerMod
	const pdfjs = await import('./pdf.min.mjs')
	log('pdfjs loaded')
	const data = new Uint8Array(await (await fetch('./book.pdf')).arrayBuffer())
	const doc = await pdfjs.getDocument({ data }).promise
	log('pages:', doc.numPages)
	const page = await doc.getPage(1)
	const vp = page.getViewport({ scale: 1.2 })
	const canvas = document.getElementById('c')
	canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height)
	const ctx = canvas.getContext('2d')
	const task = page.render({ canvasContext: ctx, viewport: vp })
	await task.promise
	log('render done')
	const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data
	let nonwhite = 0
	for (let i = 0; i < d.length; i += 4) { if (d[i] < 245 || d[i+1] < 245 || d[i+2] < 245) nonwhite++ }
	log('nonwhite px:', nonwhite)
	try {
		const div = document.createElement('div')
		div.style.position = 'relative'
		div.style.width = vp.width + 'px'; div.style.height = vp.height + 'px'
		div.style.setProperty('--total-scale-factor', '1.2')
		document.body.append(div)
		const tl = new pdfjs.TextLayer({ textContentSource: page.streamTextContent(), container: div, viewport: vp })
		await tl.render()
		log('textlayer spans:', div.querySelectorAll('span').length)
	} catch (e) { log('textlayer FAILED:', e?.message || String(e)) }
	log('SPIKE-OK')
} catch (e) {
	log('FATAL:', e?.message || String(e))
	log(e?.stack || '')
	log('SPIKE-FAIL')
}
</script>
</body></html>
