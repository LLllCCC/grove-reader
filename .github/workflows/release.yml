name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # foliate-js 已拆为 submodule（lib/foliate-js），必须递归拉取才能构建
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install deps
        run: npm install --no-audit --no-fund

      # 社区版：不含 PDF 阅读。Obsidian 官方目录安装时只下载
      # main.js / manifest.json / styles.css，pdfjs 的 5.9 MB 运行时资源
      # 拿不到，所以目录分发的主资产必须是这个构建。
      - name: Build community (no PDF)
        run: |
          npm run build:community
          mkdir -p dist-community
          cp main.js dist-community/main.js
          cp manifest.json dist-community/manifest.json
          cp styles.css dist-community/styles.css

      # 目录站要求 Release 只包含 main.js / manifest.json / styles.css；
      # 完整版（含 PDF）发布到配套仓库 LLllCCC/grove-reader-full，见 scripts/publish-full.mjs。
      - name: Attest assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist-community/main.js
            dist-community/manifest.json
            dist-community/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --generate-notes \
            dist-community/main.js \
            dist-community/manifest.json \
            dist-community/styles.css
