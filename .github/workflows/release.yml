name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm install --no-audit --no-fund
          npm run build

      # PDF 运行时资源单独打包：Obsidian 安装器只取 main.js / manifest.json / styles.css，
      # 这份 zip 是给需要 PDF 功能的用户手动解压进插件目录用的。
      - name: Pack PDF assets
        run: |
          cd pdfjs && zip -qr ../grove-reader-pdfjs-assets.zip . && cd ..

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            grove-reader-pdfjs-assets.zip

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css grove-reader-pdfjs-assets.zip

  # 一次性任务：把已存在的 draft release 转正，避免手动点 Publish。
  # 发布完成后会连同 branches 触发条件一起移除。
  publish-draft:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish any draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | while read -r tag; do
            if [ -n "$tag" ]; then
              gh release edit "$tag" --draft=false
              echo "已发布 $tag"
            fi
          done

